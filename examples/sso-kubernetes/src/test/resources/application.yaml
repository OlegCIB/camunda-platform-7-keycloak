# Test configuration using spring-boot

cibseven.bpm:
  job-execution.enabled: true
  id-generator: simple

spring.datasource:
  url: jdbc:h2:mem:cibseven-spring-boot-test;DB_CLOSE_ON_EXIT=false

# CIB seven Rest API
rest.security:
  enabled: false
  provider: keycloak
  required-audience: cibseven-rest-api
